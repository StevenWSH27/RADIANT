<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">RADIANT</title>
  <desc id="desc">Redundancy-Aware Information Allocation for Universal Multi-Modal Fusion</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#102a43"/>
      <stop offset="1" stop-color="#21104f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6ff"/>
      <stop offset="0.5" stop-color="#9b87f5"/>
      <stop offset="1" stop-color="#ff7ac8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="65" r="150" fill="#7c5cff" opacity="0.13"/>
  <circle cx="110" cy="300" r="190" fill="#20c9d8" opacity="0.1"/>
  <path d="M55 55 H1145" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
  <text x="70" y="135" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="8">RADIANT</text>
  <text x="72" y="178" fill="#c7d7ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Redundancy-Aware Information Allocation for Universal Multi-Modal Fusion</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">
    <rect x="72" y="220" width="205" height="55" rx="15" fill="#0e4060" stroke="#54d6ff"/>
    <circle cx="102" cy="247" r="8" fill="#54d6ff" filter="url(#glow)"/>
    <text x="122" y="254" fill="#e9f8ff">Shared Evidence</text>
    <rect x="298" y="220" width="205" height="55" rx="15" fill="#302463" stroke="#a895ff"/>
    <circle cx="328" cy="247" r="8" fill="#a895ff" filter="url(#glow)"/>
    <text x="348" y="254" fill="#f1edff">Unique Evidence</text>
    <rect x="524" y="220" width="225" height="55" rx="15" fill="#59264e" stroke="#ff82cb"/>

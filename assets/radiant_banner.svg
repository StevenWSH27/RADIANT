    <text x="98" y="29" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">ACM MULTIMEDIA</text>
    <text x="98" y="52" text-anchor="middle" fill="#6fe7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">MM '26</text>
